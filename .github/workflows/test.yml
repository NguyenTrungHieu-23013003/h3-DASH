name: H3-DASH CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pylint

    - name: "[Khóa 3] Static Analysis — pylint"
      run: |
        pylint network_api.py \
          --disable=C0103,C0321 \
          --output-format=text \
          --fail-under=7.0 \
          || true
        pylint network_api.py --output-format=text > pylint_report.txt 2>&1 || true
        cat pylint_report.txt

    - name: "[Khóa 1/2] Run Unit & Integration Tests with Coverage"
      run: |
        pytest tests/test_network_api.py -v --cov=network_api \
          --cov-report=xml --cov-report=term-missing

    - name: "[Khóa 3] Automated Analysis — Quality Gates"
      run: |
        python3 analyze_results.py

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: |
          coverage.xml
          pylint_report.txt
